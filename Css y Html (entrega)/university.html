  <section>
    <h2 id="universidad">The Marionette's Automatons</h2>
    <p>
      En este cuarto apartado, se encuentran una serie de audios que
      expresan diferentes sonidos provenientes de la universidad,
      acompañados por representaciones artísticas de estos.
    </p>

    <article>
      <h3>Aprendizaje infinito</h3>
      <audio controls>
        <source src="Audios/Representaciones de universidad/Aprendizaje infinito.ogg" type="audio/ogg" />
      </audio>
      <figure>
        <img src="Dibujos/Representaciones de universidad/Aprendizaje infinito.png" width="300px"
          alt="Dibujo representando el aprendizaje infinito" />
        <figcaption>Representación artística del aprendizaje infinito</figcaption>
      </figure>
    </article>
